name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: Spec vectors & docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify test vectors against the reference model
        run: python3 spec/reference/policy_ref.py --check spec/test-vectors
      - name: Check relative links in Markdown
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments './**/*.md'
          fail: true

  core:
    name: Core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --manifest-path windows/Cargo.toml --all -- --check
      - name: Test core
        run: cargo test --manifest-path windows/Cargo.toml -p memmanager-core
      - name: Clippy core
        run: cargo clippy --manifest-path windows/Cargo.toml -p memmanager-core -- -D warnings

  windows:
    name: Windows app (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - name: Build (release)
        run: cargo build --manifest-path windows/Cargo.toml --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: -C target-feature=+crt-static
      - name: Clippy
        run: cargo clippy --manifest-path windows/Cargo.toml --target ${{ matrix.target }} --all-targets -- -D warnings
      - name: Unit tests
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo test --manifest-path windows/Cargo.toml --target ${{ matrix.target }}
      - name: Self-test on the live system
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $exe = "windows/target/${{ matrix.target }}/release/memmanager.exe"
          "Binary size: $((Get-Item $exe).Length) bytes"
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest=20','--out=selftest.json' -Wait -PassThru
          Get-Content selftest.json
          if ($p.ExitCode -ne 0) { throw "selftest exited with $($p.ExitCode)" }
      - name: In-app update against the real releases (download + checksum, no install)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        env:
          MEMMANAGER_GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $exe = "windows/target/${{ matrix.target }}/release/memmanager.exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--check-update','--pretend-version=0.0.1','--as-installed','--download','--out=update.json' -Wait -PassThru
          Get-Content update.json
          $j = Get-Content update.json | ConvertFrom-Json
          if ($j.error -match 'rate-limit') { "::warning::GitHub API rate limit reached; update check skipped"; exit 0 }
          if ($p.ExitCode -ne 0 -or -not $j.verified) { throw "update check failed" }
      - name: Benchmark (realistic bloat)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = "windows/target/${{ matrix.target }}/release/memmanager.exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--bench','--out=bench-windows.json' -Wait -PassThru
          Get-Content bench-windows.json
          python scripts/bench_report.py bench-windows.json
          if ($p.ExitCode -ne 0) { throw "bench exited with $($p.ExitCode)" }
      - name: Build installer
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          iscc /Q /DAppVersion=0.0.0 "/DX64Exe=$PWD\windows\target\${{ matrix.target }}\release\memmanager.exe" "/DOutputDir=$PWD\dist" windows\installer\MemManager.iss
          Get-ChildItem dist
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: memmanager-${{ matrix.target }}
          path: |
            windows/target/${{ matrix.target }}/release/memmanager.exe
            selftest.json
            bench-windows.json
            dist/*.exe
          if-no-files-found: ignore

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: macos
        run: swift build -c release
      - name: Test (spec vectors)
        working-directory: macos
        run: swift test
      - name: Self-test on the live system
        working-directory: macos
        run: |
          ./.build/release/MemManager --selftest=10 --out=selftest.json
          cat selftest.json
      - name: In-app update against the real releases (download + checksum, no install)
        working-directory: macos
        env:
          MEMMANAGER_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          ./.build/release/MemManager --check-update --pretend-version=0.0.1 --download --out=update.json
          code=$?
          cat update.json; echo
          if grep -q rate-limit update.json; then echo "::warning::GitHub API rate limit reached; update check skipped"; exit 0; fi
          [ "$code" -eq 0 ] && grep -q '"verified":true' update.json
      - name: Benchmark (realistic bloat, as root)
        working-directory: macos
        continue-on-error: true
        run: |
          sudo ./.build/release/MemManager --bench --out=bench-macos.json
          sudo chown "$(id -u)" bench-macos.json
          cat bench-macos.json
          python3 ../scripts/bench_report.py bench-macos.json
      - name: Bundle app and disk image
        working-directory: macos
        run: |
          VERSION=0.0.0 ./scripts/bundle.sh release
          ditto -c -k --keepParent build/MemManager.app build/MemManager.app.zip
          ./scripts/make_dmg.sh build/MemManager.dmg
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: MemManager-macos
          path: |
            macos/build/MemManager.app.zip
            macos/build/MemManager.dmg
            macos/selftest.json
            macos/bench-macos.json
          if-no-files-found: ignore
