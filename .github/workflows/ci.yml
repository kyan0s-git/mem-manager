name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: Spec vectors & docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify test vectors against the reference model
        run: python3 spec/reference/policy_ref.py --check spec/test-vectors
      - name: Check relative links in Markdown
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments './**/*.md'
          fail: true

  core:
    name: Core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --manifest-path windows/Cargo.toml --all -- --check
      - name: Test core
        run: cargo test --manifest-path windows/Cargo.toml -p memmanager-core
      - name: Clippy core
        run: cargo clippy --manifest-path windows/Cargo.toml -p memmanager-core -- -D warnings

  windows:
    name: Windows app (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - name: Build (release)
        run: cargo build --manifest-path windows/Cargo.toml --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: -C target-feature=+crt-static
      - name: Clippy
        run: cargo clippy --manifest-path windows/Cargo.toml --target ${{ matrix.target }} --all-targets -- -D warnings
      - name: Unit tests
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo test --manifest-path windows/Cargo.toml --target ${{ matrix.target }}
      - name: Self-test on the live system
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $exe = "windows/target/${{ matrix.target }}/release/memmanager.exe"
          "Binary size: $((Get-Item $exe).Length) bytes"
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest=20','--out=selftest.json' -Wait -PassThru
          Get-Content selftest.json
          if ($p.ExitCode -ne 0) { throw "selftest exited with $($p.ExitCode)" }
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: memmanager-${{ matrix.target }}
          path: |
            windows/target/${{ matrix.target }}/release/memmanager.exe
            selftest.json
          if-no-files-found: ignore

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: macos
        run: swift build -c release
      - name: Test (spec vectors)
        working-directory: macos
        run: swift test
      - name: Self-test on the live system
        working-directory: macos
        run: |
          ./.build/release/MemManager --selftest=10 --out=selftest.json
          cat selftest.json
      - name: Bundle app
        working-directory: macos
        run: |
          ./scripts/bundle.sh release
          ditto -c -k --keepParent build/MemManager.app build/MemManager.app.zip
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: MemManager-macos
          path: |
            macos/build/MemManager.app.zip
            macos/selftest.json
